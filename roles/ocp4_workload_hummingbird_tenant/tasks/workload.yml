---
- name: Get Quay credentials from user_info
  ansible.builtin.set_fact:
    _ocp4_workload_hummingbird_tenant_quay_url: "{{ lookup('agnosticd_user_data', 'quay_url') | default('undefined') }}"
    _ocp4_workload_hummingbird_tenant_quay_hostname: "{{ lookup('agnosticd_user_data', 'quay_hostname') | default('undefined') }}"
    _ocp4_workload_hummingbird_tenant_quay_user: "{{ lookup('agnosticd_user_data', 'quay_user') | default('undefined') }}"
    _ocp4_workload_hummingbird_tenant_quay_password: "{{ lookup('agnosticd_user_data', 'quay_password') | default('undefined') }}"

- name: Create resources for the lab
  kubernetes.core.k8s:
    state: present
    template: "{{ item }}"
  loop:
  - vm.yaml.j2
  - service-vm.yaml.j2
  - route-vm.yaml.j2
  - clusterrolebinding-builds.yaml.j2

- name: Save VM user information
  agnosticd.core.agnosticd_user_info:
    data:
      rhel_vm_name: "{{ ocp4_workload_hummingbird_tenant_vm_name }}"
      rhel_vm_user: "{{ ocp4_workload_hummingbird_tenant_vm_user }}"
      rhel_vm_password: "{{ ocp4_workload_hummingbird_tenant_vm_password }}"
