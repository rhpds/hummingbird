---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhtas
  namespace: openshift-gitops
spec:
  destination:
    namespace: ""
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: {{ ocp4_workload_hummingbird_infra_rhtas_repo }}
    targetRevision: {{ ocp4_workload_hummingbird_infra_rhtas_repo_ref }}
    path: {{ ocp4_workload_hummingbird_infra_rhtas_repo_path }}
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
