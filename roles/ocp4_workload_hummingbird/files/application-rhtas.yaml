---
apiVersion: argoproj.io/v1alpha1
kind: Application            
metadata:
  name: rhtas
  namespace: openshift-gitops
spec:
  destination:
    namespace: ""
    server: https://kubernetes.default.svc
  project: default
  source:
    path: bootstrap/06-rhtas-operator
    repoURL: https://github.com/rhpds/hummingbird-showroom.git
    targetRevision: main
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
